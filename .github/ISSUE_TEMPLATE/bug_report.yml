name: Bug report
description: Report a problem with ProxiLens
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Please remove personal information, other sensitive data from logs before posting.
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Start ProxiLens...
        2. Check the GNOME session status...
        3. Observe the result...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: ProxiLens version
      placeholder: "v0.1.0"
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: Operating system and architecture
      placeholder: "Ubuntu 24.04 LTS, amd64"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      render: text
    validations:
      required: false
