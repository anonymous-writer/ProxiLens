name: Test DEB (AMD64)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-deb-amd64-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-deb:
    name: Build test DEB (amd64)
    runs-on: ubuntu-24.04
    steps:
      - name: Check out selected branch
        uses: actions/checkout@v4

      - name: Install Debian build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            debhelper \
            dpkg-dev \
            pkg-config \
            libgl1-mesa-dev \
            libegl1-mesa-dev \
            xorg-dev \
            libwayland-dev \
            libxkbcommon-dev \
            wayland-protocols

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Download Go dependencies
        run: go mod download

      - name: Run Go tests
        run: go test ./...

      - name: Build AMD64 Debian package
        env:
          PROXILENS_VERSION: test-${{ github.run_number }}
          PROXILENS_COMMIT: ${{ github.sha }}
          PROXILENS_BUILD_KIND: Test-Build
        run: |
          set -euo pipefail
          SHORT_SHA="${GITHUB_SHA:0:7}"
          export PROXILENS_LDFLAGS="-X github.com/local/proxilens/internal/buildinfo.Version=${PROXILENS_VERSION} -X github.com/local/proxilens/internal/buildinfo.Commit=${PROXILENS_COMMIT} -X github.com/local/proxilens/internal/buildinfo.BuildKind=${PROXILENS_BUILD_KIND}"
          BASE_VERSION="$(git describe --tags --abbrev=0 2>/dev/null || echo v2.0.1)"
          DEB_VERSION="${BASE_VERSION#v}~test.${GITHUB_RUN_NUMBER}+${SHORT_SHA}"
          sed -i "1s/^proxilens ([^)]*)/proxilens (${DEB_VERSION}-1)/" debian/changelog
          dpkg-buildpackage -us -uc -b -d

          VERSION="$(dpkg-parsechangelog --show-field Version)"
          ARCH="$(dpkg --print-architecture)"
          PACKAGE="../proxilens_${VERSION}_${ARCH}.deb"

          test "$ARCH" = "amd64"
          test -f "$PACKAGE"
          mkdir -p dist
          cp "$PACKAGE" "dist/ProxiLens-test-${VERSION}-amd64.deb"
          sha256sum "dist/ProxiLens-test-${VERSION}-amd64.deb" \
            > "dist/ProxiLens-test-${VERSION}-amd64.deb.sha256"
          dpkg-deb --info "dist/ProxiLens-test-${VERSION}-amd64.deb"

      - name: Upload test DEB
        uses: actions/upload-artifact@v4
        with:
          name: proxilens-test-deb-amd64-${{ github.run_number }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14
