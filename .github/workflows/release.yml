
name: Build GitHub release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  linux:
    name: Build Linux ${{ matrix.arch }} release
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Check out release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libgl1-mesa-dev \
            libegl1-mesa-dev \
            xorg-dev \
            libwayland-dev \
            libxkbcommon-dev \
            wayland-protocols

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Resolve dependencies
        run: go mod download

      - name: Run tests
        run: go test ./...

      - name: Build release
        env:
          VERSION: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail

          mkdir -p dist/proxilens

          COMMIT="$(git rev-parse HEAD)"
          BUILD_LDFLAGS="-s -w -X github.com/local/proxilens/internal/buildinfo.Version=${VERSION} -X github.com/local/proxilens/internal/buildinfo.Commit=${COMMIT} -X github.com/local/proxilens/internal/buildinfo.BuildKind=Release"
          go build -trimpath -ldflags="-s -w" -o dist/proxilens/proxilens-wake-agent ./cmd/proxilens-wake-agent
          go build -trimpath -ldflags="${BUILD_LDFLAGS}" -o dist/proxilens/proxilens-ui .

          cp README.md dist/proxilens/

          if [ -f LICENSE ]; then
            cp LICENSE dist/proxilens/
          fi

          printf '%s\n' "$VERSION" > dist/proxilens/VERSION

          tar -czf "dist/ProxiLens-${VERSION}-linux-${{ matrix.arch }}.tar.gz" \
            -C dist proxilens

          sha256sum \
            "dist/ProxiLens-${VERSION}-linux-${{ matrix.arch }}.tar.gz" \
            > "dist/ProxiLens-${VERSION}-linux-${{ matrix.arch }}.tar.gz.sha256"

          # Match the Debian package version to the published GitHub tag.
          DEB_VERSION="${VERSION#v}"
          sed -i "1s/^proxilens ([^)]*)/proxilens (${DEB_VERSION}-1)/" debian/changelog
          export PROXILENS_LDFLAGS="-X github.com/local/proxilens/internal/buildinfo.Version=${VERSION} -X github.com/local/proxilens/internal/buildinfo.Commit=${COMMIT} -X github.com/local/proxilens/internal/buildinfo.BuildKind=Release"

          # Build the Debian package from the same architecture-specific runner.
          sudo apt-get update
          sudo apt-get install -y debhelper dpkg-dev
          dpkg-buildpackage -us -uc -b -d
          cp "../proxilens_${DEB_VERSION}-1_$(dpkg --print-architecture).deb" "dist/ProxiLens-${VERSION}-linux-${{ matrix.arch }}.deb"
          sha256sum "dist/ProxiLens-${VERSION}-linux-${{ matrix.arch }}.deb" > "dist/ProxiLens-${VERSION}-linux-${{ matrix.arch }}.deb.sha256"

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail

          gh release upload "$TAG" \
            "dist/ProxiLens-${TAG}-linux-${{ matrix.arch }}.tar.gz" \
            "dist/ProxiLens-${TAG}-linux-${{ matrix.arch }}.tar.gz.sha256" \
            "dist/ProxiLens-${TAG}-linux-${{ matrix.arch }}.deb" \
            "dist/ProxiLens-${TAG}-linux-${{ matrix.arch }}.deb.sha256" \
            --clobber

